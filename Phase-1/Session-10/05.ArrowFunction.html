<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Arrow Function</h1>
    <script>
        //simple function
            function hello(){
                console.log("Hello World!");
            }
            hello();

       //arrow function =>
    welcome=()=>{
        console.log("Welcome")
    }
    welcome();
    //arrow function with IIFE

    (()=>{console.log("Welcome to Arrow Function With IIFE")})();
    
    </script>
</body>
</html>
