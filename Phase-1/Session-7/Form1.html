<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Form Demo</h1>
    <form action="submit.jsp" method="post">
        <!--Firstname-->
        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="fname" placeholder="Enter First Name">
        <br><br>
        <!--Middle Name-->
        <label for="mname">Middle Name:</label>
        <input type="text" id="mname" name="mname" placeholder="Enter Middle Name">
        <br><br>
        <!--Last name-->
        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname" placeholder="Enter Last Name">
        <br><br>

        <!--Email-->
        <label for="email">Email Id:</label>
        <input type="email" id="email" name="email" placeholder="Enter Your Email">
        <br><br>
        <!--Password-->
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Secret Password">

        <br><br>

        <!--Date of Birth-->
        <label for="dob"> Date of Birth</label>
        <input type="date" name="dob" id="dob" placeholder="Enter Date of Birth"><br><br>

        <!--Pincode-->
        <label for="pincode">Pincode</label>
        <input type="number" name="pin" id="pin" placeholder="Enter Your Pincode"><br><br>

        <!--checkbox-->
        <input type="checkbox" id="ch1" name="ch1"><label for="Physics">Physics</label><br>

        <!--checkbox-->
        <input type="checkbox" id="ch2" name="ch2"><label for="Chemistry">Chemistry</label><br>

        <!--checkbox-->
        <input type="checkbox" id="ch3" name="ch3"><label for="Mathematics">Mathemaice</label><br><br>

        <input type="submit" value="Register">
    </form>

</body>
</html>
