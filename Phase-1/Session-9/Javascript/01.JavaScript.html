<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     
</head>
<body>

    <!--javascript-->
    <script>
        //this is javascript
        //this is called comments in javascript
        //variables in Javascript
        //keywords used to declare varibale: let,var,const

        let x;
        x=5;
        //or
        var y=10;

        console.log("x+y:",x+y);
        document.write("x+y:",x+y);

        //Javascript is not a strict language

        //varibles in javascript
        var num=45;  //number
        var name="Nikunj Soni" //string
        var condition=true  //boolean
        var object=null   //object
        
         console.log("Num: "+num +",Type: "+typeof num);
         console.log("Name:"+name+",Type:"+typeof name);
         console.log("Condition: "+condition+",Type:"+typeof condition)
         console.log("Object:"+object+",Type:"+typeof object)

         var array=["a","b","c","d"];
         console.log("Array: ",array);

         var json={"fname":"Alex","lname":"jhon","email":"jhon@gmail.com","country":"UK"};
         console.log("JSON Array:",json)


    </script>
</body>
</html>
