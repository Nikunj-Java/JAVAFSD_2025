<div class="container">
    <h2 style="background-color: yellow;"> 1. Template Driven Form</h2>
    <div class="row">
        <form class="col-md-6 offset-3"(ngSubmit)="onSubmit()" name="form" #form=ngForm novalidate>

            <div class="form-group">
                <label>FirstName</label>
                <input type="text" name="fname" id="fname" placeholder="Enter Your First Name" [(ngModel)]="fname" required class="form-control" #firstName="ngModel"/>
                <!-- Error Handling Can be done here-->
                 <div *ngIf="!firstName?.valid && (firstName?.dirty || firstName?.touched)" class="error text-danger">
                    Invalid UserName
                 </div>
            </div>

            <div class="form-group">
                <label>LastName</label>
                <input type="text" name="lname" id="lname" placeholder="Enter Your Last Name" [(ngModel)]="lname" required class="form-control" #lastName="ngModel"/>
                <!-- Error Handling Can be done here-->
                 <div *ngIf="!lastName?.valid && (lastName?.dirty || lastName?.touched)" class="error text-danger">
                    Invalid LastName
                 </div>
            </div>

             <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" id="email" placeholder="Enter Your Email" [(ngModel)]="email" required class="form-control" #emailId="ngModel"/>
                <!-- Error Handling Can be done here-->
                 <div *ngIf="!emailId?.valid && (emailId?.dirty || emailId?.touched)" class="error text-danger">
                    
                    <div *ngIf="emailId.errors?.['required']">
                        Email Can't Be Empty!
                    </div>
                 </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" id="password" placeholder="Enter Your Password" [(ngModel)]="password" required class="form-control" #pass="ngModel"/>
                <!-- Error Handling Can be done here-->
                 <div *ngIf="!pass?.valid && (pass?.dirty || pass?.touched)" class="error text-danger">
                     
                    <div *ngIf="pass.errors?.['required']">
                        Password Can't Be Empty!
                    </div>
                 </div>
            </div>

             <div class="form-group">
                
              <button type="submit" class="btn btn-success" [disabled]="!form.valid">Register</button>
                <!-- Error Handling Can be done here-->
            </div>
        </form>
    </div>
</div>
